project:
  type: website

website:
  page-navigation: true
  page-footer: 
    center: "<a href='https://creativecommons.org/licenses/by-nc-sa/4.0/'><img src='https://mirrors.creativecommons.org/presskit/logos/cc.logo.large.png' style='width:100px'></a>"
  title: "Ciência de dados"
  navbar:
    left:
      - text: Curso
        menu:
          - text: Estatística
            href: curso/estatistica/curso_estatistica.qmd
          - text: R
            href: curso/r/curso_r.qmd
      - blog.qmd
    right:
      - about.qmd
      - icon: github
        href: https://github.com/flavianowilliams/education
  sidebar:
    - id: curso_estatistica
      title: "Estatística"
      style: "docked"
      search: true
      contents:
        - curso/estatistica/planejamento_pesquisa/planejamento_pesquisa.qmd
        - curso/estatistica/amostragem/amostragem.qmd
        - curso/estatistica/resumo_dados/resumo_dados.qmd
        - curso/estatistica/analise_uma_variavel/analise_uma_variavel.qmd
        - curso/estatistica/analise_duas_variaveis/analise_duas_variaveis.qmd
        - curso/estatistica/analise_multivariada/analise_multivariada.qmd
    - id: curso_r
      title: "R"
      style: "docked"
      search: true
      contents:
        - curso/r/introducao/introducao.qmd
        - curso/r/r_base/r_base.qmd
        - curso/r/estrutura_dados/estrutura_dados.qmd
        - curso/r/wrangling/wrangling.qmd
        - curso/r/ggplot2/ggplot2.qmd

format:
  html:
    toc: true
    toc-location: right
    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 200px
      gutter-width: 1.5rem
    theme:
      - flatly
    css: styles.css
bibliography: bibliografia.bib
csl: abnt.csl
lang: "pt-BR"
date-format: DD/MM/YYYY

execute:
  freeze: auto